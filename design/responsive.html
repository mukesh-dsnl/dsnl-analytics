<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Preview</title>
  <meta name="description" content="DSNL Analytics prototype rendered at exactly 1440 and 1920 pixels wide.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    body { height: auto; overflow: auto; background: var(--color-bg-subtle); }
    .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 20px; background: var(--color-bg-surface); border-bottom: 1px solid var(--color-border-default); }
    .bar strong { font-size: 14px; margin-right: 8px; }
    .stage { padding: 20px; overflow: hidden; }
    .frame-wrap { margin: 0 auto; transform-origin: top left; }
    .frame-label { font: 500 12px/16px var(--font-sans); color: var(--color-text-muted); margin-bottom: 8px; }
    iframe { display: block; border: 1px solid var(--color-border-strong); border-radius: 10px; background: #fff; box-shadow: var(--shadow-2); }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Responsive preview</strong>
    <div class="segmented" id="w"><button data-w="1440" class="is-active">1440 × 900</button><button data-w="1920">1920 × 1080</button></div>
    <select class="select" id="route" style="width:240px">
      <option value="#/analytics/all">Dashboard · All Services</option>
      <option value="#/analytics/voicedrop">Dashboard · Voicedrop</option>
      <option value="#/analytics/conference">Dashboard · Conference</option>
      <option value="#/analytics/voicedrop?tab=custom">Dashboard · Custom tab</option>
      <option value="#/analytics/voicedrop/campaign">Campaign metrics</option>
      <option value="#/upload">Upload data</option>
      <option value="#/reports">Reports</option>
      <option value="#/assistant/c-1042">AI assistant</option>
      <option value="#/login">Sign in</option>
    </select>
    <span class="muted" style="font-size:12px">The frame is the real width, scaled down to fit this window.</span>
  </div>
  <div class="stage"><div class="frame-label" id="label"></div><div class="frame-wrap" id="wrap"><iframe id="f" title="Prototype preview"></iframe></div></div>
  <script>
    (function () {
      var w = 1440, f = document.getElementById('f'), wrap = document.getElementById('wrap');
      try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('dsnl-proto:theme')) || 'light'; } catch (e) {}
      function fit() {
        var h = w === 1440 ? 900 : 1080;
        var scale = Math.min(1, (window.innerWidth - 40) / w);
        f.style.width = w + 'px';
        f.style.height = h + 'px';
        wrap.style.width = w + 'px';
        wrap.style.transform = 'scale(' + scale + ')';
        wrap.style.height = h * scale + 'px';
        document.getElementById('label').textContent = w + ' × ' + h + ' at ' + Math.round(scale * 100) + '%';
      }
      function load() {
        try { localStorage.setItem('dsnl-proto:signedIn', 'true'); } catch (e) {}
        f.src = 'index.html' + document.getElementById('route').value;
      }
      document.getElementById('w').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        w = Number(b.dataset.w);
        this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('is-active', x === b); });
        fit();
      });
      document.getElementById('route').addEventListener('change', load);
      window.addEventListener('resize', fit);
      fit(); load();
    })();
  </script>
</body>
</html>
